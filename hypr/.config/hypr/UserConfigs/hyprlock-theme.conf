# Generated by sddm-themes/lock-theme.py from theme-staircase.conf [General]/[Lock] — do not edit.
$lockTextColor = rgb(FFF5E9)
$lockAccentColor = rgb(ED93FF)
$lockDatePosition = 0%,-13.333333%
$lockUserPosition = 0%,200
$lockInputPosition = 0%,100

# One label, one date call: the gaps are markup, so hours and minutes cannot drift apart.
label {
    monitor =
    text = cmd[update:1000] date +'<span foreground="##F1DA83">%H</span><span size="15pt"> </span><span foreground="##ED93FF">%M</span><span size="55pt"> </span><span foreground="##E3C399" size="70pt" rise="30720">%S</span>'
    color = $lockTextColor
    font_size = 150
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0%,0%
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgb(000000)
}

label {
    monitor =
    text = <span>NOTHING TO COMMIT</span>
    color = $lockTextColor
    font_size = 24
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0%,300
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgb(000000)
}
