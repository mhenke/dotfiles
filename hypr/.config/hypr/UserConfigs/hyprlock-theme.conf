# Generated by sddm-themes/lock-theme.py from theme-space-nebula.conf [General]/[Lock] — do not edit.
$lockTextColor = rgb(FFF5E9)
$lockAccentColor = rgb(FFBC87)
$lockDatePosition = 26%,4.666667%
$lockUserPosition = 26%,200
$lockInputPosition = 26%,100

# One label, one date call: the gaps are markup, so hours and minutes cannot drift apart.
label {
    monitor =
    text = cmd[update:1000] date +'<span foreground="##FFF2E5">%H</span><span size="15pt"> </span><span foreground="##FFBC87">%M</span><span size="55pt"> </span><span foreground="##BCAEFF" size="70pt" rise="30720">%S</span>'
    color = $lockTextColor
    font_size = 150
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 26%,18%
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgb(000000)
}

label {
    monitor =
    text = <span>PROMPT TO LAUNCH</span>
    color = $lockTextColor
    font_size = 24
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 26%,300
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgb(000000)
}
