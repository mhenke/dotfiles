# Hypridle 
# Original config submitted by https://github.com/SherLock707                                                       
                                                      
$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    lock_cmd = ~/.config/hypr/scripts/hyprlock-guarded.sh # marker for watchdog; clean exit clears it
    unlock_cmd = sh -c 'killall hyprlock; rm -f "${XDG_RUNTIME_DIR:-/tmp/hypr-watchdog-$(id -u)}/.watchdog-locked"' # clear marker so watchdog does not respawn
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = hyprctl dispatch dpms on # turn of screen after sleep (not strictly necessary, but just in case)
    ignore_dbus_inhibit = false            # REVERTED 2026-09-11: =true let idle listeners fire during agent sessions; every firing (DPMS-off @690s, hibernate @1800s) ended in hyprlock death. omp's inhibitor keeps listeners idle while agents run.
}

# Warn
listener {
    timeout = 600                     # 10 min
    on-timeout = notify-send -i $iDIR " You are idle!" # command to run when timeout has passed
    on-resume = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"  # command to run when activity is detected after timeout has fired.
}

# Screenlock
listener {
    timeout = 660                     # 11 min
    on-timeout = loginctl lock-session # command to run when timeout has passed
    #on-resume = notify-send -i $iDIR " System Unlocked!"  # command to run when activity is detected after timeout has fired.
}
# DPMS-off-while-locked REMOVED 2026-09-11: state where hyprlock 0.9.6 crashes
# (upstream #76, omarchy #5521). Was a Hyprland 0.39 freeze workaround; stale
# after 0.56 upgrade. Screen off now happens via hibernate (S4) only.

# Hibernate (S4 is the only viable sleep on this BIOS - no S3, s2idle burns 5-15W)
listener {
    timeout = 1800
    on-timeout = systemctl hibernate
    on-resume = notify-send -i $iDIR " Oh! you're back" "Hello !!!"
}