modelRoles:
  scout: omniroute/explorer
  librarian: omniroute/librarian
  designer: omniroute/designer
  task: omniroute/explorer
  oracle: omniroute/oracle
  skeptic: omniroute/skeptic
  default: zai/glm-5.3-flash:max
disabledProviders:
  - llama.cpp
  - lm-studio
  - bedrock-mantle
  - amazon-bedrock
providers:
  webSearchOrder:
    - exa
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - omniroute/orchestrator
    skeptic:
      - omniroute/skeptic
    scout:
      - omniroute/explorer
    task:
      - omniroute/explorer
    librarian:
      - omniroute/librarian
    designer:
      - omniroute/designer
    oracle:
      - omniroute/oracle
task:
  agentModelOverrides:
    oracle: "@oracle"
    reviewer: "@skeptic"
    skeptic: commandcode/meta/muse-spark-1.3-contributor
    scout: "@scout"
    task: "@task"
  disabledAgents:
    []
theme:
  light: titanium
  dark: titanium
memory:
  backend: mnemopi
github:
  enabled: true
setupVersion: 2
defaultThinkingLevel: auto
dev:
  autoqaConsent: denied
skills:
  customDirectories:
    - /home/mhenke/.config/opencode/skills