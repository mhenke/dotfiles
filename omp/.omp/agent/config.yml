modelRoles:
  scout: omniroute/explorer
  librarian: omniroute/librarian
  designer: omniroute/designer
  task: omniroute/explorer
  oracle: omniroute/oracle
  skeptic: omniroute/skeptic
  default: commandcode/poolside/laguna-s-2.1-free:high
disabledProviders:
  - llama.cpp
  - lm-studio
  - bedrock-mantle
  - amazon-bedrock
providers:
  webSearchOrder:
    - exa
    - perplexity
    - gemini
    - anthropic
    - codex
    - xai
    - zai
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
retry:
  enabled: true
  maxRetries: 10
  baseDelayMs: 500
  maxDelayMs: 300000
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - omniroute/orchestrator
    skeptic:
      - omniroute/skeptic
    scout:
      - omniroute/explorer
    task:
      - omniroute/explorer
    librarian:
      - omniroute/librarian
    designer:
      - omniroute/designer
    oracle:
      - omniroute/oracle
task:
  agentModelOverrides:
    oracle: "@oracle"
    reviewer: "@skeptic"
    skeptic: "@skeptic"
    designer: "@designer"
    librarian: "@librarian"
    scout: "@scout"
    task: "@task"
theme:
  light: titanium
  dark: titanium
memory:
  backend: mnemopi
github:
  enabled: true
setupVersion: 2