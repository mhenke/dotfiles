providers:
  omniroute:
    baseUrl: http://localhost:20128/v1
    api: openai-completions
    # !command keeps the key in opencode's auth.json instead of this tracked
    # file (see resolve-config-value.ts). Same shape as kimi-code below.
    apiKey: "!jq -r '.omniroute.key' $HOME/.local/share/opencode/auth.json"
    authHeader: true
    models:
      - id: orchestrator
        name: OmniRoute Orchestrator
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: skeptic
        name: OmniRoute Skeptic
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: explorer
        name: OmniRoute Explorer
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: librarian
        name: OmniRoute Librarian
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: designer
        name: OmniRoute Designer
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: oracle
        name: OmniRoute Oracle
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: observer
        name: OmniRoute Observer
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: fixer
        name: OmniRoute Fixer
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072
      - id: static-best-free
        name: OmniRoute Static Best Free
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 200000
        maxTokens: 131072

  # Kimi Code Plan (global kimi.ai account). baseUrl redirects the built-in
  # kimi-code provider off the mainland default (api.kimi.com) — the plan bills
  # against the kimi.ai subscription, not per-token.
  # apiKey is a !command (resolved at request time, see resolve-config-value.ts),
  # so the secret stays in opencode's auth.json and never enters this tracked file.
  # No `models:` block on purpose: the built-in provider discovers from
  # /coding/v1/models, keeping limits and thinking levels current.
  kimi-code:
    baseUrl: https://api.kimi.ai/coding/v1
    apiKey: "!jq -r '.[\"kimi-code-plan-global\"].key' $HOME/.local/share/opencode/auth.json"

  # MiMo Token Plan (platform.xiaomimimo.com subscription, not yet active).
  # apiKey is a !command resolved at request time, so the secret stays in
  # opencode's auth.json and never enters this tracked file.
  # Explicit models: no discovery claim until the plan is live.
  mimo-token:
    baseUrl: https://token-plan-ams.xiaomimimo.com/v1
    apiKey: "!jq -r '.mimo.key' $HOME/.local/share/opencode/auth.json"
    authHeader: true
    api: openai-completions
    models:
      - id: mimo-v2.6-pro
        name: MiMo V2.6 Pro
        reasoning: true
        supportsTools: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072
      - id: mimo-v2.6-flash
        name: MiMo V2.6 Flash
        reasoning: true
        supportsTools: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072
